name: Build Ubuntu package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    container: python:3.10-bullseye
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      VERSION: "0.1.0"
    steps:
      - name: Pin Bullseye package repositories
        run: |
          cat > /etc/apt/sources.list <<'EOF'
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260830/ bullseye main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260830/ bullseye-updates main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260830/ bullseye-security main
          EOF

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            binutils \
            dpkg-dev \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: mastermind-ubuntu-amd64
          path: dist/mastermind_*.deb
          if-no-files-found: error
